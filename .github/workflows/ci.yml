name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Pin the gating linters so the blocking checks are reproducible.
        pip install pytest pytest-cov mypy flake8==7.3.0 black==26.5.1 isort==8.0.1

    - name: Run linting
      run: |
        # Critical syntax/name errors fail the build.
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Style/complexity warnings are advisory only.
        flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check formatting with black
      run: |
        black --check --diff src/ tests/

    - name: Check import sorting with isort
      run: |
        isort --check-only --diff src/ tests/

    - name: Type checking with mypy
      run: |
        mypy src/ --ignore-missing-imports --no-error-summary
      continue-on-error: true  # Don't fail build on type checking issues initially

    - name: Run tests
      run: |
        python -m pytest tests/ -v --cov=src/ --cov-report=xml

    - name: Test basic functionality
      run: |
        python -m src.main --help || python -c "import src.main; print('Import successful')"
      continue-on-error: true  # Don't fail if help command isn't implemented
